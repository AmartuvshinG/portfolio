<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The navbar monogram (components/chrome/NavGlyphs.tsx), recut for a tab:
       the hex fills the square, strokes are thickened to survive 16px, and the
       ground is opaque void so the mark holds on a light tab bar too.
       Master for scripts/bake-favicons.mjs — rerun it after editing. -->
  <defs>
    <linearGradient id="ramp" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="0.5" stop-color="#ff8a6b"/>
      <stop offset="1" stop-color="#9fe3ec"/>
    </linearGradient>
  </defs>
  <path d="M16 1.6 28.7 8.9v14.2L16 30.4 3.3 23.1V8.9Z" fill="#061317" stroke="url(#ramp)" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M10.2 23.2 16 8.6l5.8 14.6M12.4 18.2h7.2" fill="none" stroke="#e4f1f3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
