# Static checks on every push and pull request.
#
# This repo had no tests and no CI, which meant nothing at all verified a push.
# That was a larger reliability gap than any amount of tooling could close: at
# least two of the four contact-form bugs fixed in 01a075f were statically
# visible and would have been caught here the moment they were written.
#
# Static checks first, then one behavioural check. The accessibility sweep was
# held out while WordReveal / ScrambleText had a known aria bug, because a
# permanently red pipeline is one everyone learns to ignore. That bug is fixed
# and `npm run axe` is clean, so it runs here now — it is the only check that
# catches a regression the type system cannot see.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant. Cancel it
# rather than queueing behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # The static checks are ~2 minutes. The accessibility sweep adds a browser
    # download, a server boot and six passes with a 2.6s settle each.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches local development. Pinning to an older LTS would mean CI and
          # the machine the code is written on disagree about what passes, which
          # is worse than either version on its own.
          node-version: '24'
          cache: npm

      # `npm ci`, never `npm install`: it installs exactly the committed
      # lockfile and fails if package.json and the lock have drifted apart,
      # which is itself worth catching.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Last, and not redundant with the two above: `next build` runs the React
      # Compiler, prerenders every route and resolves the Tailwind v4 pipeline —
      # a whole class of failure that only appears in a production build. The
      # Tailwind v3-syntax bug fixed in 01a075f lived in exactly that gap.
      - name: Build
        run: npm run build

      # `channel: "chrome"` in scripts/axe.mjs means real Google Chrome, not a
      # Playwright-pinned build, so this installs the distro package and its
      # shared libraries. It is not redundant with the runner image: Chrome
      # being preinstalled there is an implementation detail of the image, and
      # this job should not silently depend on it.
      - name: Install Chrome
        run: npx --yes playwright install --with-deps chrome

      # Last, and the only step that needs a running server. `npm run start`
      # serves the build produced above — it will not work without it.
      #
      # Under xvfb rather than switching the script to headless: axe.mjs
      # launches headed on purpose, and giving CI a virtual display keeps one
      # code path, so a local run and a CI run are the same run. (No GPU here
      # either way, but these are correctness assertions — unaffected. Any
      # *performance* number out of this job would be fiction.)
      - name: Accessibility
        run: |
          npm run start &
          npx --yes wait-on http://localhost:3000 --timeout 60000
          xvfb-run -a npm run axe
